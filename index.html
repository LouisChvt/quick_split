<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Split - Partage d'addition</title>
    <style>
        /* Le CSS reste identique, il est déjà optimisé et moderne. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .tip-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .tip-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e1e8ed;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #555;
        }

        .tip-btn:hover, .tip-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .result-box {
            margin-top: 35px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .result-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .result-amount {
            color: white;
            font-size: 3em;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .breakdown {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e1e8ed;
        }

        .breakdown-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
            font-weight: 600;
            color: #333;
        }

        .currency-symbol {
            font-size: 0.7em;
            vertical-align: top;
            margin-right: 2px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.6em;
            }
            .result-amount {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="split-form">
            <h1>⚡ Quick Split</h1>
            <p class="subtitle">Partagez l'addition en un instant</p>
            
            <div class="input-group">
                <label for="total">Montant total (€)</label>
                <input type="number" id="total" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
            </div>
            
            <div class="input-group">
                <label for="people">Nombre de personnes</label>
                <input type="number" id="people" placeholder="2" min="1" step="1" value="2" inputmode="numeric" pattern="[0-9]*">
            </div>
            
            <div class="input-group">
                <label for="tip">Pourboire (%)</label>
                <input type="number" id="tip" placeholder="0" min="0" value="0" inputmode="numeric" pattern="[0-9]*">
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="0">0%</button>
                    <button type="button" class="tip-btn" data-tip="10">10%</button>
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                </div>
            </div>
        </form> <div class="result-box" aria-live="polite">
            <div class="result-label">Chacun paie</div>
            <div class="result-amount">
                <span class="currency-symbol">€</span><span id="result">0.00</span>
            </div>
        </div>
        
        <div class="breakdown" id="breakdown" style="display: none;">
            <div class="breakdown-item">
                <span>Sous-total par personne</span>
                <span id="subtotal">€0.00</span>
            </div>
            <div class="breakdown-item">
                <span>Pourboire par personne</span>
                <span id="tipAmount">€0.00</span>
            </div>
            <div class="breakdown-item">
                <span>Total par personne</span>
                <span id="finalTotal">€0.00</span>
            </div>
        </div>
    </div>

    <script>
        // Sélection du formulaire pour empêcher la soumission
        const splitForm = document.getElementById('split-form');
        const totalInput = document.getElementById('total');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const resultElement = document.getElementById('result');
        const breakdownElement = document.getElementById('breakdown');
        const subtotalElement = document.getElementById('subtotal');
        const tipAmountElement = document.getElementById('tipAmount');
        const finalTotalElement = document.getElementById('finalTotal');
        const tipButtons = document.querySelectorAll('.tip-btn');

        function calculate() {
            const total = parseFloat(totalInput.value) || 0;
            // Vérification plus robuste pour s'assurer que le nombre de personnes est au moins 1
            const people = parseInt(peopleInput.value, 10) >= 1 ? parseInt(peopleInput.value, 10) : 1;
            const tipPercent = parseFloat(tipInput.value) || 0;
            
            // Pour éviter les valeurs négatives
            if (total < 0 || people < 1 || tipPercent < 0) return;
            
            const tipAmount = total * (tipPercent / 100);
            const totalWithTip = total + tipAmount;
            const perPerson = totalWithTip / people;
            const subtotalPerPerson = total / people;
            const tipPerPerson = tipAmount / people;
            
            resultElement.textContent = perPerson.toFixed(2);
            
            if (total > 0) {
                breakdownElement.style.display = 'block';
                subtotalElement.textContent = `€${subtotalPerPerson.toFixed(2)}`;
                tipAmountElement.textContent = `€${tipPerPerson.toFixed(2)}`;
                finalTotalElement.textContent = `€${perPerson.toFixed(2)}`;
            } else {
                breakdownElement.style.display = 'none';
            }
        }

        // Empêche le formulaire de se soumettre
        splitForm.addEventListener('submit', (e) => e.preventDefault());

        // Calcul automatique
        [totalInput, peopleInput, tipInput].forEach(input => {
            input.addEventListener('input', () => {
                calculate();
                if (input.id === 'tip') {
                    updateTipButtons();
                }
            });
        });

        // Boutons de pourboire rapide
        tipButtons.forEach(button => {
            button.addEventListener('click', function() {
                const tipValue = this.dataset.tip; // Utilisation de dataset pour plus de clarté
                tipInput.value = tipValue;
                updateTipButtons();
                calculate();
            });
        });

        function updateTipButtons() {
            const currentTip = tipInput.value;
            tipButtons.forEach(button => {
                if (button.dataset.tip === currentTip) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        // Calcul initial au chargement
        calculate();
    </script>
</body>
</html>
